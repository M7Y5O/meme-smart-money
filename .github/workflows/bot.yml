name: Smart Money bot

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may delay runs when busy)
  workflow_dispatch:         # "Run workflow" button for manual runs
    inputs:
      command:
        description: "What to run"
        type: choice
        default: tick
        options: [tick, sync, tiktok, story, story-copy, story-styles, story-timing, receipts, check-telegram, telegram-chats, test-x-draft, test-telegram, test-x]

concurrency:
  group: smart-money-bot
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The bot's memory (seen trades, posted alerts) lives in a SQLite file kept between runs.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: msm-state-${{ github.run_id }}
          restore-keys: msm-state-

      # Video tools for the TikTok drafts (Pillow, ffmpeg, edge-tts voice, Inter fonts), installed once then cached.
      - name: Restore video tools
        id: tools
        uses: actions/cache@v4
        with:
          path: .tools
          key: msm-tools-v2

      - name: Install video tools (first run only)
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          python3 -m pip install --quiet --target .tools/py pillow imageio-ffmpeg edge-tts
          curl -sSL -o /tmp/inter.zip https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip
          mkdir -p .tools/fonts
          unzip -q -j -o /tmp/inter.zip 'extras/ttf/Inter-Bold.ttf' 'extras/ttf/Inter-SemiBold.ttf' 'extras/ttf/Inter-Medium.ttf' 'extras/ttf/InterDisplay-Bold.ttf' 'extras/ttf/InterDisplay-SemiBold.ttf' -d .tools/fonts

      - name: Run one cycle
        run: mkdir -p state && python3 -m msm ${{ inputs.command || 'tick' }}
        env:
          DB_PATH: state/msm.sqlite3
          PYTHONPATH: .tools/py
          MSM_FONT_DIR: .tools/fonts
          # X keys are blanked when the POST_TO_X variable is 'false' (Telegram-only mode)
          # Secrets: repo Settings > Secrets and variables > Actions > Secrets
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          X_API_KEY: ${{ vars.POST_TO_X != 'false' && secrets.X_API_KEY || '' }}
          X_API_SECRET: ${{ vars.POST_TO_X != 'false' && secrets.X_API_SECRET || '' }}
          X_ACCESS_TOKEN: ${{ vars.POST_TO_X != 'false' && secrets.X_ACCESS_TOKEN || '' }}
          X_ACCESS_SECRET: ${{ vars.POST_TO_X != 'false' && secrets.X_ACCESS_SECRET || '' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FOMO_API_KEY: ${{ secrets.FOMO_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Settings: repo Settings > Secrets and variables > Actions > Variables
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL }}
          X_DRAFTS_CHAT_ID: ${{ vars.X_DRAFTS_CHAT_ID }}
          FOMO_REF_LINK: ${{ vars.FOMO_REF_LINK }}
          FOMO_LEADERBOARD_URL: ${{ vars.FOMO_LEADERBOARD_URL }}
          FOMO_AUTH_HEADER: ${{ vars.FOMO_AUTH_HEADER }}
          FOMO_AUTH_PREFIX: ${{ vars.FOMO_AUTH_PREFIX }}
          FOMO_ITEMS_PATH: ${{ vars.FOMO_ITEMS_PATH }}
          FOMO_FIELD_NAME: ${{ vars.FOMO_FIELD_NAME }}
          FOMO_FIELD_WALLET: ${{ vars.FOMO_FIELD_WALLET }}
          FOMO_FIELD_PNL: ${{ vars.FOMO_FIELD_PNL }}
          FOMO_FIELD_X: ${{ vars.FOMO_FIELD_X }}
          PNL_PERIOD_LABEL: ${{ vars.PNL_PERIOD_LABEL }}
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: msm-state-${{ github.run_id }}
